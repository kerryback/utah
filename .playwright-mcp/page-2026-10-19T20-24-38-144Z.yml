        - row [ref=e45]:
          - cell "Operating lease right-of-use assets" [ref=e46]
          - cell "excluded" [ref=e47]
          - cell [ref=e48]:
            - text: Right-of-use assets move with the lease liability, not with sales.
            - paragraph [ref=e49]: Judgment call Excluded with the operating lease liability, because rent of about $2.4 billion a year is inside OSG&A and so already inside EBITDA. Treating the liability as debt instead would subtract about $15.6 billion (roughly $1.94 a share) and double-count rent.
        - row [ref=e50]:
          - cell "Finance lease right-of-use assets, net" [ref=e51]
          - cell "excluded" [ref=e52]
          - cell [ref=e53]:
            - text: Finance lease assets; their amortization ($0.9 billion in FY2026) sits inside D&A.
            - paragraph [ref=e54]: Judgment call Excluded, with finance lease obligations treated as debt. The alternative is to fold these $6.1 billion of assets into net PP&E, which would lower the turnover and the depreciation rate together; future finance-leased assets are funded through the capex plug either way.
        - row [ref=e55]:
          - cell "Goodwill" [ref=e56]
          - cell "excluded" [ref=e57]
          - cell "Acquisition goodwill (Flipkart, VIZIO and others); its cash flows are already in EBITDA." [ref=e58]
        - row [ref=e59]:
          - cell "Other long-term assets" [ref=e60]
          - cell "excluded" [ref=e61]
          - cell [ref=e62]:
            - text: Intangibles (about $4.3 billion indefinite-lived), $5.7 billion of equity and debt investments, $1.9 billion of deferred tax assets, and other.
            - paragraph [ref=e63]: Judgment call Excluded as one line. About $5.7 billion of it is equity investments and the Asda debt investment, which are non-operating; classifying the whole line as non-operating would add $14.1 billion, and carving out just the investments would add about $5.7 billion (roughly $0.71 a share).
