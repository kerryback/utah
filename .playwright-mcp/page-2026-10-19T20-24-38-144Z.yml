    - heading "Classification of every reported balance-sheet line" [level=2] [ref=e15]
    - paragraph [ref=e16]: Which lines consume cash as the business grows (operating assets, operating liabilities, net PP&E), which are claims on what it produces or are added in the bridge (debt claims, equity claims, nonoperating assets), and which do neither (excluded). Everything downstream inherits this, so it is worth disagreeing with here rather than later.
