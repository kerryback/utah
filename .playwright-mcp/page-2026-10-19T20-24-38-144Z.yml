            - paragraph [ref=e108]: Judgment call Excluded. The roughly $7.3 billion that is not deferred tax (long-term self-insurance, indemnifications, swap liabilities and other) is arguably a debt-like claim; subtracting it would lower value by about $0.91 a share.
