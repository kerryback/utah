        - heading [level=2]: AI cannot make the judgment calls
        - blockquote:
          - paragraph: Technology itself does not decide what the future looks like. People do. For all the promise of AI … AI cannot decide which problems are worth solving. It cannot make the hard judgment calls with imperfect information. It cannot take responsibility for the outcome. These are our responsibilities. And they matter more now than ever.
        - paragraph:
