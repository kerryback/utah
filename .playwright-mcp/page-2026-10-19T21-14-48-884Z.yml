      - generic [aria-hidden]:
        - heading [level=2]: Verifiable tasks vs judgment
        - generic:
          - blockquote:
            - paragraph: The gulf between LLM performance on verifiable tasks vs. unverifiable tasks that require judgment is larger than most people realize. Verifiable tasks, like coding or solving math problems, have a right answer that can be checked automatically. Judgment tasks don’t have unambiguous, ground-truth, correct answers. But they do have better and worse answers.
            - generic:
              - paragraph: We have much better techniques for training AI systems to do well on verifiable tasks. As a result, progress on performing such tasks has been much faster than for judgment tasks.
        - paragraph:
          - generic: Andrew Ng, co-founder and former head of Google Brain, co-founder of Coursera and DeepLearning.AI · The Batch, October 16, 2026
