          - generic:
            - paragraph: Tell Claude
          - paragraph: Create a /basin-ridge skill. It merges the four Basin Ridge workbooks into monthly tables of actual and budget by department and account, and by region and product, with monthly salaries computed from the roster. It checks that GL revenue equals the sales detail and that GL salaries match the roster, and saves the merged tables as a workbook. Then it answers my question about variance against budget by month, department, account, region or product, with a chart and a short summary, and adds the result to the workbook as a new sheet.
        - generic:
          - paragraph: The merge and the checks are the same every time and are saved as a script in the skill.
