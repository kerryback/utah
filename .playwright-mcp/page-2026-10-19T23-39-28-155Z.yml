          - paragraph [ref=f17e5]: A chat window on the company’s website. A customer asks about an order. The agent looks the order up in the order system, checks the shipping status and drafts the reply. It can issue a refund up to $100. A larger refund, or an unusual case, goes to a person with the conversation attached.
          - generic [ref=f17e6]:
            - generic [ref=f17e7]:
              - paragraph [ref=f17e8]:
                - generic [ref=f17e9]: Why a custom agent
              - paragraph [ref=f17e10]: Customers do not have Claude. The refund limit is a rule in the agent’s code, so nothing a customer types can raise it. Every conversation and refund is logged.
            - generic [ref=f17e11]:
              - paragraph [ref=f17e12]:
                - generic [ref=f17e13]: Why not
              - paragraph [ref=f17e14]: The company builds, hosts and secures it, and pays for API tokens on every conversation. Customer-service platforms sell agents like this.
