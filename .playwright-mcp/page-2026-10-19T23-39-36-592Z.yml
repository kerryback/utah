    - text: Speaker notes
    - generic [ref=f17e35]: "Things you choose Your interface A chat page or a button inside your own software, for customers or staff who do not use Claude or ChatGPT. Your tools and data Only the tools you choose: your database, your functions, the MCP servers you trust. Nothing else. Your rules A fixed system prompt, the model you choose for each job, a spending limit, and a log of every call. Agent SDKs (Claude Agent SDK, OpenAI Agents SDK) supply the harness and the built-in tools. The Claude Agent SDK gives you the Claude Code harness."
