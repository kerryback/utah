          - heading [level=2]: Admissions assistant
          - paragraph: A chat page on the program’s website for applicants. It answers questions about deadlines, requirements, tuition and courses from the program’s own documents, and cites the page it used. A question the documents do not answer, or a question about one applicant’s file, goes to admissions staff.
          - generic:
            - generic:
              - paragraph:
                - generic: Why a custom agent
              - paragraph: Applicants do not have Claude. The agent can reach only the program’s documents, not the web or student records.
            - generic:
              - paragraph:
                - generic: Why not
              - paragraph: Vendors sell this as a product. The answers are only as current as the documents behind them.
        - generic [aria-hidden]:
          - heading [level=2]: Sales-call prep agent
          - paragraph: Runs the evening before each client meeting on a salesperson’s calendar. It pulls the account’s CRM history, open support tickets and recent invoices, searches the news for the client, and sends the salesperson a one-page brief.
          - generic:
            - generic:
              - paragraph:
                - generic: Why a custom agent
              - paragraph: It runs on a schedule, without anyone asking, and every salesperson gets the brief in the same format.
            - generic:
              - paragraph:
                - generic: Why not
              - paragraph: A salesperson who has Claude, a CRM connector and a skill can get the same brief on request. It reads both company data and the web, so it needs the separation on the research-team slide.
        - generic [ref=f17e126]:
          - heading "FP&A analyst agent" [level=2] [ref=f17e127]
          - paragraph [ref=f17e128]: A chat page for managers. A manager asks how the department is doing against budget. The agent queries the general ledger, the sales detail and the headcount roster through a read-only MCP server, runs the calculations in Python, and explains each variance by price, volume, rate and headcount, with a chart.
          - generic [ref=f17e129]:
            - generic [ref=f17e130]:
              - paragraph [ref=f17e131]:
                - generic [ref=f17e132]: Why a custom agent
              - paragraph [ref=f17e133]: Managers without Claude can ask. The connection to the ledger is read-only, the system prompt fixes how variances are explained, and every question and answer is logged.
            - generic [ref=f17e134]:
              - paragraph [ref=f17e135]:
                - generic [ref=f17e136]: Why not
              - paragraph [ref=f17e137]: Analysts who have Claude and the same MCP server can ask the same questions directly. The answers still have to be checked against the ledger.
        - generic [aria-hidden]:
          - heading [level=2]: Contract review agent
          - paragraph: For the company’s attorneys. The company’s contracts and its standard terms are split into passages and indexed (RAG). An attorney asks, for example, which supplier contracts cap liability below the standard or renew automatically. The agent retrieves the matching clauses and answers, citing the contract and the clause.
          - generic:
            - generic:
              - paragraph:
                - generic: Why a custom agent
              - paragraph: It answers only from the indexed contracts and cites each clause, so the attorney can check every answer. The index stays inside the company.
            - generic:
              - paragraph:
                - generic: Why not
              - paragraph: Legal AI products sell this. Retrieval can miss a clause with unusual wording, so the attorney still reads the contract.
        - generic [aria-hidden]:
          - heading [level=2]: Research team
          - paragraph: Three agents. The orchestrator, the one you chat with, splits a question into two parts. A data agent queries the data warehouse and returns data and analysis. A web agent searches the web and returns information. The orchestrator combines the two answers.
          - generic:
            - generic:
              - paragraph:
                - generic: Why a custom agent
              - paragraph: Each agent reads only its own material, and each job can use a smaller model. The web agent reads untrusted pages and never touches company data, so an instruction hidden in a web page cannot reach that data.
            - generic:
              - paragraph:
                - generic: Why not
              - paragraph: More agents means more calls and more tokens, and three agents to build and test instead of one.
