    - text: Speaker notes
    - generic [ref=f7e33]: "Example: an FP&A agent Tell Claude Using the claude_agent_sdk (version 0.2.168 or later), create a FastAPI agent app called app.py with a simple chat page where managers ask how their department or Basin Ridge Outfitters is doing against budget. Connect it to the Basin Ridge MCP server at https://basinridge.kerryback.com/mcp . Create an internal MCP server with one tool, run_python , that runs Python with only data-analysis imports, gives the code a sql() function that queries the Basin Ridge server, and shows matplotlib charts in the chat. Do all arithmetic in run_python . Explain each variance by price, volume, rate and headcount, and decline unrelated questions. Set tools=[] , permission_mode to dontAsk , and max_turns to 15, and include all the tools in allowed_tools . Questions to ask it: Which departments and accounts are furthest from budget through September, and why? What full-year revenue does the run rate imply? “Do all arithmetic in run_python ” was added after the agent computed a percentage in its head and got it wrong."
